const hdrs = { "Content-Type":"application/json", apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` };

// Upload gambar ke Supabase Storage, return public URL
async function uploadGambar(base64, filename) {
  try {
    if (!base64) return null;
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/laporan-gambar/${filename}`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "image/jpeg" },
      body: await (await fetch(base64)).blob()
    });
    if (!res.ok) return null;
    return `${SUPABASE_URL}/storage/v1/object/public/laporan-gambar/${filename}`;
  } catch(e) { return null; }
}

// Upload semua gambar dalam object (nested), return object dengan URL
async function uploadAllGambar(obj, prefix) {
  if (Array.isArray(obj)) {
    return await Promise.all(obj.map((v,i) => uploadAllGambar(v, `${prefix}_${i}`)));
  }
  if (obj && typeof obj === "object") {
    const r = {};
    for (const k in obj) {
      if (k === "gambar" && Array.isArray(obj[k])) {
        r[k] = await Promise.all((obj[k]||[]).map(async (src,i) => {
          if (!src || src.startsWith("http")) return src;
          // Include timestamp in filename for auto-delete tracking
          const fname = `${prefix}_${k}_${i}_${Date.now()}.jpg`;
          return await uploadGambar(src, fname);
        }));
      } else {
        r[k] = await uploadAllGambar(obj[k], `${prefix}_${k}`);
      }
    }
    return r;
  }
  return obj;
}

// Auto delete gambar lebih 30 hari dari Supabase Storage
async function autoCleanupGambar() {
  try {
    const res = await fetch(`${SUPABASE_URL}/storage/v1/object/list/laporan-gambar`, {
      method: "POST",
      headers: { ...hdrs },
      body: JSON.stringify({ prefix: "", limit: 1000, offset: 0 })
    });
    if (!res.ok) return;
    const files = await res.json();
    const cutoff = Date.now() - (30 * 24 * 60 * 60 * 1000); // 30 hari
    const toDelete = (files||[]).filter(f => {
      // Extract timestamp from filename e.g. ..._1234567890123.jpg
      const match = f.name.match(/_(\d{13})\.jpg$/);
      if (!match) return false;
      return parseInt(match[1]) < cutoff;
    }).map(f => f.name);

    if (toDelete.length === 0) return;
    await fetch(`${SUPABASE_URL}/storage/v1/object/laporan-gambar`, {
      method: "DELETE",
      headers: { ...hdrs },
      body: JSON.stringify({ prefixes: toDelete })
    });
    console.log(`Auto-deleted ${toDelete.length} gambar lama`);
  } catch(e) { console.log("Cleanup error:", e); }
}

const LS = "laporan_warden_v2", LS_J = "jadual_bertugas_offline";
const local = {
  all: () => { try { return JSON.parse(localStorage.getItem(LS)||"[]"); } catch { return []; } },
  save: d => { const rec={...d,id:`local_${Date.now()}`,created_at:new Date().toISOString(),_offline:true}; localStorage.setItem(LS,JSON.stringify([rec,...local.all()])); return rec; },
  remove: id => localStorage.setItem(LS,JSON.stringify(local.all().filter(r=>r.id!==id))),
};
const localJ = {
  all: () => { try { return JSON.parse(localStorage.getItem(LS_J)||"[]"); } catch { return []; } },
  upsert: rows => {
    const arr=Array.isArray(rows)?rows:[rows], merged=[...localJ.all()];
    arr.forEach(row=>{ const idx=merged.findIndex(e=>e.tarikh===row.tarikh); const rec={...row,id:"jadual_"+row.tarikh,created_at:new Date().toISOString()}; if(idx>=0) merged[idx]=rec; else merged.push(rec); });
    merged.sort((a,b)=>a.tarikh.localeCompare(b.tarikh));
    localStorage.setItem(LS_J,JSON.stringify(merged));
  },
  remove: id => localStorage.setItem(LS_J,JSON.stringify(localJ.all().filter(r=>r.id!==id))),
};

// ── GambarSlots component ─────────────────────────────────────
function GambarSlots({ imgs, onChange }) {
  const slots = imgs || [null, null];
  function pick(slot) {
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "image/*";
    inp.onchange = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const rd = new FileReader();
      rd.onload = function(ev) {
        const newImgs = [...slots];
        newImgs[slot] = ev.target.result;
        onChange(newImgs);
      };
      rd.readAsDataURL(file);
    };
    inp.click();
  }
  function remove(slot) {
    const newImgs = [...slots];
    newImgs[slot] = null;
    onChange(newImgs);
  }
  return (
    <div className="gambar-row">
      {[0,1].map(slot => (
        <div key={slot} className="img-wrap">
          <div className={`img-slot${slots[slot]?" filled":""}`} onClick={() => pick(slot)}>
            {slots[slot]
              ? <img src={slots[slot]} alt=""/>
              : <span style={{fontSize:20,color:"#cbd5e1"}}>📷</span>
            }
          </div>
          {slots[slot] && <button className="img-del" onClick={e=>{e.stopPropagation();remove(slot);}}>x</button>}
        </div>
      ))}
    </div>
  );
}

  }

  function getBulkLaporan() {
    if (bulkType==="hari") return filteredLaporan.filter(l=>l.tarikh===bulkDate);
    if (bulkType==="minggu") {
      if (!bulkWeek) return [];
      const [yr,wk] = bulkWeek.split("-W").map(Number);
      const jan4 = new Date(yr,0,4);
      const weekStart = new Date(jan4);
      weekStart.setDate(jan4.getDate() - (jan4.getDay()||7) + 1 + (wk-1)*7);
      const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
      return filteredLaporan.filter(l=>{ const d=new Date(l.tarikh+"T00:00:00"); return d>=weekStart&&d<=weekEnd; });
    }
    if (bulkType==="bulan") {
      if (!bulkMonth) return [];
      return filteredLaporan.filter(l=>l.tarikh.startsWith(bulkMonth));
    }
    if (bulkType==="tarikh") {
      if (!bulkFrom||!bulkTo) return [];
      return filteredLaporan.filter(l=>l.tarikh>=bulkFrom&&l.tarikh<=bulkTo);

    return [];

    // Strip gambar dari payload Supabase (terlalu besar)
    function stripGambar(obj) {
      if (Array.isArray(obj)) return obj.map(stripGambar);
      if (obj && typeof obj === "object") {
        const r = {};
        for (const k in obj) {
          if (k === "gambar") r[k] = (obj[k]||[]).map(()=>null); // kosongkan gambar
          else r[k] = stripGambar(obj[k]);
        }
        return r;
      }
      return obj;
    }

    setLoading(true);
    showToast("⏳ Menghantar laporan...", "warn");

    // Upload gambar ke Supabase Storage dulu
    const prefix = `${form.tarikh}_${form.nama_warden.replace(/\s+/g,"_")}`;
    const formWithUrls = await uploadAllGambar({...form, warden_color: warden?.color}, prefix);

    const {error} = await db.insertLaporan(formWithUrls);
    if (error) {
      console.error("Supabase error:", error);
      local.save(formWithUrls);
      showToast("⚠️ Error: " + JSON.stringify(error).slice(0,100), "err");
    } else {
      showToast("✅ Laporan berjaya dihantar!");
    }
    setForm(initForm());
    setLoading(false);
    loadLaporan();
  }

  function requestDeleteLap(id) {
    if (adminUnlocked) {
      if (!window.confirm("Padam laporan ini?")) return;
      doDeleteLap(id);
    } else {
      setPendingDeleteId(id);
      setShowAdminPin(true);
      setAdminPinInput("");
      setAdminPinError(false);
    }
  }
  async function doDeleteLap(id) {
    if (String(id).startsWith("local_")) local.remove(id); else await db.deleteLaporan(id);
    loadLaporan(); showToast("🗑️ Laporan dipadam");
  }
  function checkAdminPin() {
    if (adminPinInput===JADUAL_PIN) {
      setAdminUnlocked(true);
      setShowAdminPin(false);
      setAdminPinError(false);
      if (pendingDeleteId) { doDeleteLap(pendingDeleteId); setPendingDeleteId(null); }
    } else {
      setAdminPinError(true);
      setTimeout(()=>setAdminPinError(false),1500);
    }
  }

  function checkPin() {
    if (pinInput===JADUAL_PIN) { setPinUnlocked(true); setPinError(false); }
    else { setPinError(true); setTimeout(()=>setPinError(false),1500); }
  }

  async function addJadual() {
    if (!newTarikh||!newWarden) return;
    const row = {tarikh:newTarikh,nama_warden:newWarden};
    const {error} = await db.upsertJadual(row);
    if (error) { localJ.upsert(row); showToast("💾 Jadual disimpan offline","warn"); } else showToast("✅ Jadual disimpan!");
    loadJadual();
  }

  async function deleteJadual(id) {
    if (!window.confirm("Padam entri jadual ini?")) return;
    if (String(id).startsWith("jadual_")) localJ.remove(id); else await db.deleteJadual(id);
    loadJadual(); showToast("🗑️ Jadual dipadam");
  }

  async function scanJadual(file) {
    setScanning(true); setScanResult(null); setScanError("");
    try {
      const base64 = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.onerror=rej; r.readAsDataURL(file); });
      const names = WARDENS.map(w=>w.nama).join(", ");
      const isPDF = file.type==="application/pdf";
      const contentBlock = isPDF
        ? {type:"document",source:{type:"base64",media_type:"application/pdf",data:base64}}
        : {type:"image",source:{type:"base64",media_type:file.type||"image/jpeg",data:base64}};
      const resp = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":"ANTHROPIC_API_KEY_HERE","anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        messages:[{role:"user",content:[
          contentBlock,
          {type:"text",text:`Ini jadual giliran warden. Nama warden yang ada: ${names}. Padankan nama dalam jadual dengan nama yang diberikan. Balas JSON array sahaja tanpa sebarang teks lain: [{"tarikh":"YYYY-MM-DD","nama_warden":"nama penuh"}]`}
        ]}]
      })});
      const data = await resp.json();
      if(data.error) throw new Error(data.error.message);
      const text = (data.content||[]).map(c=>c.text||"").join("").trim().replace(/```json|```/g,"").trim();
      setScanResult(JSON.parse(text));
    } catch(e) { setScanError("Gagal baca jadual: "+e.message); }
    setScanning(false);
  }

  async function confirmScan() {
    if (!scanResult) return;
    const {error} = await db.upsertJadual(scanResult);
    if (error) { localJ.upsert(scanResult); showToast("💾 Disimpan offline","warn"); } else showToast(`✅ ${scanResult.length} entri disimpan!`);
    setScanResult(null); loadJadual();
  }

              return (
                <div style={{marginBottom:14}}>

                  <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {WARDENS.map(w=>{
                      const isDuty=w.nama===todayDuty, isSel=loginName===w.nama;
                      return (
                        <button key={w.nama} onClick={()=>setLoginName(w.nama)} style={{
                          padding:"13px 16px",borderRadius:12,cursor:"pointer",fontWeight:700,fontSize:13,
                          border:`2px solid ${isSel?w.color:isDuty?w.color+"88":"#1e293b"}`,

                          <div style={{fontWeight:700,fontSize:12,color:"#0f172a",marginBottom:6,padding:"6px 10px",background:"#f1f5f9",borderRadius:7,display:"flex",alignItems:"center"}}>1. Pergerakan Pelajar {gpkCtrl(1)}</div>
                          {DISIPLIN_ITEMS.map(item=>{
                            const d=(l.disiplin||{})[item]||{};
                            return (
                              <div key={item} style={{display:"flex",gap:8,padding:"5px 10px",borderBottom:"1px solid #f8fafc",alignItems:"center",flexWrap:"wrap"}}>
                                <span style={{minWidth:180,color:"#64748b"}}>{item}</span>
                                {d.penilaian&&<span style={{fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:20,background:d.penilaian==="Ikut jadual"?"#dcfce7":"#fee2e2",color:d.penilaian==="Ikut jadual"?"#15803d":"#dc2626"}}>{d.penilaian}</span>}
                                {d.catatan&&<span style={{color:"#374151",fontSize:12}}>{d.catatan}</span>}
                                {renderGambar(d.gambar)}
                              </div>
                            );
                          })}
                          {gpkUlasan(1)}
                        </div>
                      )}

                      {/* Aspek 2-6 */}
                      {ASPEK_TEMPLATE.map(kat=>(
                        <div key={kat.bil} style={{marginBottom:14}}>
                          <div style={{fontWeight:700,fontSize:12,color:"#0f172a",marginBottom:6,padding:"6px 10px",background:"#f1f5f9",borderRadius:7,display:"flex",alignItems:"center"}}>{kat.bil}. {kat.kategori} {gpkCtrl(kat.bil+1)}</div>
                          {kat.items.length>0 ? kat.items.map(item=>{
                            const key=`${kat.bil}_${item}`, d=(l.aspek||{})[key]||{};
                            if(!d.skala&&!d.catatan) return null;
                            return (
                              <div key={item} style={{display:"flex",gap:8,padding:"5px 10px",borderBottom:"1px solid #f8fafc",alignItems:"center",flexWrap:"wrap"}}>
                                <span style={{minWidth:140,color:"#64748b"}}>{item}</span>
                                {d.skala>0&&<span style={{fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:20,background:SKALA_BG[d.skala],color:SKALA_COLOR[d.skala]}}>{d.skala} – {SKALA_LABEL[d.skala]}</span>}
                                {d.catatan&&<span style={{color:"#374151",fontSize:12}}>{d.catatan}</span>}
                                {d.tindakan&&<span style={{color:"#94a3b8",fontSize:11,fontStyle:"italic"}}>→ {d.tindakan}</span>}
                                {renderGambar(d.gambar)}
                              </div>
                            );
                          }) : (()=>{
                            const key=`${kat.bil}`, d=(l.aspek||{})[key]||{};
                            if(!d.skala&&!d.catatan) return null;
                            return (
                              <div style={{display:"flex",gap:8,padding:"5px 10px",alignItems:"center",flexWrap:"wrap"}}>
                                {d.skala>0&&<span style={{fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:20,background:SKALA_BG[d.skala],color:SKALA_COLOR[d.skala]}}>{d.skala} – {SKALA_LABEL[d.skala]}</span>}
                                {d.catatan&&<span style={{color:"#374151",fontSize:12}}>{d.catatan}</span>}
                                {renderGambar(d.gambar)}
                              </div>
                            );
                          })()}
                          {gpkUlasan(kat.bil+1)}
                        </div>
                      ))}

                      {/* Item 7 Disiplin */}
                      {l.disiplin_status&&(
                        <div style={{marginBottom:14}}>
                          <div style={{fontWeight:700,fontSize:12,color:"#0f172a",marginBottom:6,padding:"6px 10px",background:"#f1f5f9",borderRadius:7,display:"flex",alignItems:"center"}}>7. Disiplin {gpkCtrl(7)}</div>
                          <div style={{padding:"6px 10px"}}>
                            <span style={{fontSize:12,fontWeight:700,padding:"3px 10px",borderRadius:20,background:l.disiplin_status==="Terkawal"?"#dcfce7":"#fee2e2",color:l.disiplin_status==="Terkawal"?"#15803d":"#dc2626"}}>{l.disiplin_status==="Terkawal"?"✅ Terkawal":"⚠️ Ada Salahlaku"}</span>
                          </div>
                          {l.disiplin_status==="Ada Salahlaku"&&(l.pelajar_disiplin||[]).map((p,pi)=>(
                            <div key={pi} style={{margin:"6px 10px",padding:"8px 10px",background:"#fff7ed",borderRadius:8,border:"1px solid #fed7aa",fontSize:12}}>
                              <div style={{fontWeight:600,color:"#ea580c"}}>{p.nama_pelajar||"—"}</div>
                              <div style={{color:"#64748b",fontSize:11}}>{p.kelas} • {p.dorm}</div>
                              {p.kesalahan&&<div style={{marginTop:4,color:"#374151"}}>Kesalahan: {p.kesalahan}</div>}
                              {p.tindakan&&<div style={{color:"#94a3b8",fontStyle:"italic"}}>→ {p.tindakan}</div>}
                              {renderGambar(p.gambar)}
                            </div>
                          ))}
                          {gpkUlasan(7)}
                        </div>
                      )}

                      {/* Item 8 & 9 Kerosakan, Kehilangan */}
                      {ASPEK_CATATAN.map(a=>{
                        const d=(l.catatan_aspek||{})[a.bil]||{};
                        if(!d.status) return null;
                        const isAda=d.status==="Ada";
                        return (
                          <div key={a.bil} style={{marginBottom:14}}>
                            <div style={{fontWeight:700,fontSize:12,color:"#0f172a",marginBottom:6,padding:"6px 10px",background:"#f1f5f9",borderRadius:7,display:"flex",alignItems:"center"}}>{a.bil}. {a.label} {gpkCtrl(a.bil)}</div>
                            <div style={{padding:"6px 10px"}}>
                              <span style={{fontSize:12,fontWeight:700,padding:"3px 10px",borderRadius:20,
                                background:isAda?"#fff7ed":"#dcfce7",
                                color:isAda?"#d97706":"#15803d"}}>
                                {isAda?(a.bil===8?"⚠️ Ada Kerosakan":"⚠️ Ada Kehilangan"):(a.bil===8?"✅ Tiada Kerosakan":"✅ Tiada Kehilangan")}
                              </span>
                            </div>
                            {isAda&&(
                              <div style={{padding:"5px 10px",fontSize:12}}>
                                {d.catatan&&<div style={{color:"#374151"}}>{d.catatan}</div>}
                                {d.tindakan&&<div style={{color:"#94a3b8",fontStyle:"italic",marginTop:2}}>→ {d.tindakan}</div>}
                                {renderGambar(d.gambar)}
                              </div>
                            )}
                            {gpkUlasan(a.bil)}
                          </div>
                        );
                      })}

                      {/* Item 10 Kesihatan */}
                      {l.kesihatan_status&&(
                        <div style={{marginBottom:14}}>
                          <div style={{fontWeight:700,fontSize:12,color:"#0f172a",marginBottom:6,padding:"6px 10px",background:"#f1f5f9",borderRadius:7,display:"flex",alignItems:"center"}}>10. Kesihatan {gpkCtrl(10)}</div>
                          <div style={{padding:"6px 10px"}}>
                            <span style={{fontSize:12,fontWeight:700,padding:"3px 10px",borderRadius:20,background:l.kesihatan_status==="Tiada Pelajar Sakit"?"#dcfce7":"#fee2e2",color:l.kesihatan_status==="Tiada Pelajar Sakit"?"#15803d":"#dc2626"}}>{l.kesihatan_status==="Tiada Pelajar Sakit"?"✅ Tiada Pelajar Sakit":"🤒 Pelajar Sakit"}</span>
                          </div>
                          {l.kesihatan_status==="Pelajar Sakit"&&(l.kesihatan||[]).map((k,ki)=>(
                            <div key={ki} style={{margin:"6px 10px",padding:"8px 10px",background:"#fff1f2",borderRadius:8,border:"1px solid #fecdd3",fontSize:12}}>
                              <div style={{fontWeight:600,color:"#e11d48"}}>{k.nama_pelajar||"—"}</div>
                              <div style={{color:"#64748b",fontSize:11}}>{k.kelas} • {k.dorm}</div>
                              {k.jenis_penyakit&&<div style={{marginTop:4,color:"#374151"}}>Penyakit: {k.jenis_penyakit}</div>}
                              {k.tindakan&&<div style={{color:"#94a3b8",fontStyle:"italic"}}>→ {k.tindakan}</div>}
                              {renderGambar(k.gambar)}
                            </div>
                          ))}
                          {gpkUlasan(10)}
                        </div>
                      )}

                      {/* Item 11 Lain-lain */}
                      {(l.tindakan_selanjutnya||(l.lain_lain_gambar||[]).some(Boolean))&&(
                        <div style={{marginBottom:6}}>
                          <div style={{fontWeight:700,fontSize:12,color:"#0f172a",marginBottom:6,padding:"6px 10px",background:"#f1f5f9",borderRadius:7,display:"flex",alignItems:"center"}}>11. Lain-lain {gpkCtrl(11)}</div>
                          <div style={{padding:"5px 10px",fontSize:12,color:"#374151"}}>
                            {l.tindakan_selanjutnya}
                            {renderGambar(l.lain_lain_gambar)}
                          </div>
                          {gpkUlasan(11)}
                        </div>
                      )}



                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {/* ══ DASHBOARD ════════════════════════════════════════════ */}
        {tab==="dashboard"&&(
          <div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:18}}>
              {[{icon:"📋",val:laporanList.length,lbl:"Jumlah Laporan",c:"#2563eb"},{icon:"📅",val:todayLap,lbl:"Hari Ini",c:"#16a34a"}].map(card=>(
                <div key={card.lbl} style={{...S.card,textAlign:"center",padding:"22px 16px"}}>
                  <div style={{fontSize:28,marginBottom:6}}>{card.icon}</div>
                  <div style={{fontSize:38,fontWeight:800,color:card.c,lineHeight:1}}>{card.val}</div>
                  <div style={{fontSize:12,color:"#94a3b8",marginTop:6}}>{card.lbl}</div>
                </div>
              ))}
            </div>
            <div style={{...S.card,marginBottom:14}}>
              <h3 style={{margin:"0 0 14px",fontSize:14}}>Warden Bertugas Hari Ini</h3>
              {dutyWarden?(
                <div style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px",background:wBg(dutyWarden),borderRadius:11}}>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,color:wColor(dutyWarden),fontSize:15}}>{dutyWarden}</div>
                    <div style={{fontSize:12,color:"#64748b",marginTop:2}}>{fmtDate(today)}</div>
                  </div>
                  <span style={{fontSize:12,fontWeight:700,padding:"5px 14px",borderRadius:20,background:dutyDone?"#dcfce7":"#fee2e2",color:dutyDone?"#15803d":"#b91c1c"}}>
                    {dutyDone?"✓ Laporan Diterima":"✗ Belum Isi"}
                  </span>
                </div>
              ):<div style={{color:"#94a3b8",fontSize:13,padding:12}}>Tiada warden dijadualkan hari ini.</div>}
            </div>
            <div style={S.card}>
              <h3 style={{margin:"0 0 14px",fontSize:14}}>Jumlah Laporan Setiap Warden</h3>
              {WARDENS.map(w=>{
                const count=laporanList.filter(l=>l.nama_warden===w.nama).length;
                return (
                  <div key={w.nama} style={{marginBottom:12}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:5,fontSize:13}}>
                      <span style={{fontWeight:600,color:w.color}}>{w.nama}</span>
                      <span style={{color:"#64748b",fontWeight:700}}>{count}</span>
                    </div>
                    <div style={{background:"#f1f5f9",borderRadius:99,height:9,overflow:"hidden"}}>
                      <div style={{width:`${(count/maxCount)*100}%`,background:w.color,height:"100%",borderRadius:99,transition:"width .6s"}}/>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {/* ══ JADUAL ══════════════════════════════════════════════ */}
        {tab==="jadual"&&(
          <div>
            {!pinUnlocked?(
              <div style={{...S.card,maxWidth:360,margin:"60px auto",textAlign:"center",padding:36}}>
                <div style={{fontSize:40,marginBottom:12}}>🔐</div>
                <h3 style={{margin:"0 0 6px",fontSize:16}}>Admin Jadual Bertugas</h3>
                <p style={{color:"#94a3b8",fontSize:13,marginBottom:24}}>Masukkan PIN untuk edit jadual</p>
                <input type="password" maxLength={4} placeholder="● ● ● ●" value={pinInput} onChange={e=>setPinInput(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&checkPin()}
                  style={{...S.input,textAlign:"center",fontSize:24,letterSpacing:8,marginBottom:12,border:`2px solid ${pinError?"#dc2626":"#e2e8f0"}`}}/>
                {pinError&&<div style={{color:"#dc2626",fontSize:12,marginBottom:10,fontWeight:600}}>PIN salah.</div>}
                <button onClick={checkPin} style={{...S.btn("#0f172a","#fff"),width:"100%",padding:12}}>Masuk</button>
              </div>
            ):(
              <div>
                <div style={{...S.card,marginBottom:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
                    <h3 style={{margin:0,fontSize:15}}>Tambah / Kemaskini Jadual</h3>
                    <button onClick={()=>{setPinUnlocked(false);setPinInput("");}} style={{...S.btn("#f1f5f9","#64748b"),padding:"6px 12px",fontSize:12}}>🔒 Kunci</button>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 2fr auto",gap:10,alignItems:"end",marginBottom:18}}>
                    <div>
                      <label style={S.label}>Tarikh</label>
                      <input type="date" value={newTarikh} onChange={e=>setNewTarikh(e.target.value)} style={S.input}/>
                    </div>
                    <div>
                      <label style={S.label}>Nama Warden</label>
                      <select value={newWarden} onChange={e=>setNewWarden(e.target.value)} style={S.input}>
                        {WARDENS.map(w=><option key={w.nama}>{w.nama}</option>)}
                      </select>
                    </div>
                    <button onClick={addJadual} style={{...S.btn("#0f172a","#fff"),padding:"10px 18px"}}>+ Simpan</button>
                  </div>
                  <div style={{paddingTop:12,marginBottom:12,borderTop:"1px solid #f1f5f9",paddingTop:12}}>
                    <button onClick={async()=>{
                      if(!window.confirm("Import semua jadual Mac 2026 ke Supabase?")) return;
                      const {error} = await db.upsertJadual(MAC_2026);
                      if(error){ showToast("⚠️ Gagal import","err"); return; }
                      showToast("✅ Jadual Mac 2026 berjaya diimport!"); loadJadual();
                    }} style={{...S.btn("#0f172a","#fff"),width:"100%",padding:12,fontSize:13}}>
                      📅 Import Jadual Mac 2026 ke Supabase
                    </button>
                  </div>
                  <div style={{paddingTop:16,borderTop:"1px solid #f1f5f9"}}>
                    <div style={{fontSize:13,fontWeight:600,color:"#374151",marginBottom:4}}>📸 Upload Gambar / PDF Jadual</div>
                    <div style={{fontSize:12,color:"#94a3b8",marginBottom:12}}>AI akan baca jadual dan masukkan automatik. Support gambar (JPG/PNG) dan PDF.</div>
                    <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,padding:14,border:"2px dashed #e2e8f0",borderRadius:10,cursor:"pointer",background:scanning?"#f8fafc":"#fff"}}>
                      <input type="file" accept="image/*,application/pdf" style={{display:"none"}} onChange={e=>e.target.files[0]&&scanJadual(e.target.files[0])}/>
                      {scanning?<><span>⏳</span><span style={{fontSize:13,color:"#64748b",fontWeight:600}}>AI sedang baca jadual...</span></>
                              :<><span>📄</span><span style={{fontSize:13,color:"#64748b"}}>Klik untuk upload gambar atau PDF jadual</span></>}
                    </label>
                    {scanError&&<div style={{marginTop:10,fontSize:12,color:"#dc2626",background:"#fee2e2",padding:"8px 12px",borderRadius:8}}>{scanError}</div>}
                    {scanResult&&(
                      <div style={{marginTop:12,background:"#f0fdf4",border:"1px solid #86efac",borderRadius:10,padding:14}}>
                        <div style={{fontSize:13,fontWeight:700,color:"#15803d",marginBottom:10}}>✅ AI jumpa {scanResult.length} entri:</div>
                        <div style={{maxHeight:160,overflowY:"auto",marginBottom:12}}>
                          {scanResult.map((r,i)=>(
                            <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #dcfce7",fontSize:12}}>
                              <span>{fmtDate(r.tarikh)}</span>
                              <span style={{fontWeight:600,color:wColor(r.nama_warden)}}>{r.nama_warden}</span>
                            </div>
                          ))}
                        </div>
                        <div style={{display:"flex",gap:8}}>
                          <button onClick={confirmScan} style={{...S.btn("#16a34a","#fff"),flex:1,padding:10}}>✅ Simpan Semua</button>
                          <button onClick={()=>setScanResult(null)} style={{...S.btn("#f1f5f9","#475569"),padding:"10px 14px"}}>Batal</button>
                        </div>
                      </div>
                    )}
                  </div>
                </div>

                <div style={{...S.card,marginBottom:14,padding:14,display:"flex",gap:10,alignItems:"center"}}>
                  <label style={{...S.label,margin:0,fontSize:13,whiteSpace:"nowrap"}}>Tapis Bulan:</label>
                  <input type="month" value={fBulan} onChange={e=>setFBulan(e.target.value)} style={{...S.input,flex:1}}/>
                  <button onClick={()=>setFBulan("")} style={S.btn("#f1f5f9","#475569")}>Reset</button>
                  <span style={{fontSize:12,color:"#94a3b8",whiteSpace:"nowrap"}}>{filteredJadual.length} entri</span>
                </div>

                {filteredJadual.length===0?(
                  <div style={{...S.card,textAlign:"center",padding:50,color:"#94a3b8"}}><div style={{fontSize:36,marginBottom:10}}>📅</div>Tiada jadual.</div>
                ):filteredJadual.map(j=>{
                  const c=wColor(j.nama_warden),bg=wBg(j.nama_warden),isToday=j.tarikh===today;
                  const submitted=laporanList.some(l=>l.nama_warden===j.nama_warden&&l.tarikh===j.tarikh);
                  return (
                    <div key={j.id} style={{...S.card,marginBottom:8,padding:"14px 18px",borderLeft:`4px solid ${c}`,background:isToday?"#fffbeb":"#fff"}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                          {isToday&&<span style={{fontSize:10,background:"#fef08a",color:"#854d0e",padding:"2px 8px",borderRadius:10,fontWeight:700}}>HARI INI</span>}
                          <span style={{fontSize:13,color:"#374151"}}>{fmtDate(j.tarikh)}</span>
                          <span style={{background:bg,color:c,fontWeight:700,fontSize:12,padding:"3px 10px",borderRadius:20}}>{j.nama_warden}</span>
                        </div>
                        <div style={{display:"flex",gap:6,alignItems:"center"}}>
                          <span style={{fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:20,background:submitted?"#dcfce7":"#f1f5f9",color:submitted?"#15803d":"#94a3b8"}}>
                            {submitted?"✓ Laporan Diterima":"— Belum Isi"}
                          </span>
                          <button onClick={()=>deleteJadual(j.id)} style={{...S.btn("#fee2e2","#dc2626"),padding:"5px 10px",fontSize:12}}>🗑️</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        )}
      </div>
    {/* ADMIN PIN MODAL */}
      {showAdminPin&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:20}}>
          <div style={{background:"#fff",borderRadius:18,padding:32,width:"100%",maxWidth:340,textAlign:"center"}}>
            <div style={{fontSize:36,marginBottom:10}}>🔐</div>
            <h3 style={{margin:"0 0 6px",fontSize:16}}>Admin Diperlukan</h3>
            <p style={{color:"#94a3b8",fontSize:13,marginBottom:20}}>Masukkan PIN admin untuk padam laporan</p>
            <input type="password" maxLength={4} placeholder="● ● ● ●"
              value={adminPinInput} onChange={e=>setAdminPinInput(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&checkAdminPin()}
              style={{width:"100%",padding:"12px",border:`2px solid ${adminPinError?"#dc2626":"#e2e8f0"}`,borderRadius:10,fontSize:24,textAlign:"center",letterSpacing:8,marginBottom:10,boxSizing:"border-box",outline:"none"}}/>
            {adminPinError&&<div style={{color:"#dc2626",fontSize:12,marginBottom:10,fontWeight:600}}>PIN salah.</div>}
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>{setShowAdminPin(false);setPendingDeleteId(null);}} style={{flex:1,padding:11,border:"1px solid #e2e8f0",borderRadius:9,background:"#f1f5f9",color:"#475569",cursor:"pointer",fontWeight:600,fontSize:13}}>Batal</button>
              <button onClick={checkAdminPin} style={{flex:1,padding:11,border:"none",borderRadius:9,background:"#0f172a",color:"#fff",cursor:"pointer",fontWeight:600,fontSize:13}}>Masuk</button>
            </div>
          </div>
        </div>
      )}
    </div>)}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
